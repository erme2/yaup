name: Yaup policy validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.YAUP_APP_ID }}
          private-key: ${{ secrets.YAUP_APP_PRIVATE_KEY }}
          owner: erme2
          repositories: yaup
      - name: Download pinned yaup release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release download v0.1.0 --repo erme2/yaup --pattern 'yaup.phar' --output yaup.phar
      - run: php yaup.phar validate .
