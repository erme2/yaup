$schema: https://json-schema.org/draft/2020-12/schema
title: Yaup project configuration
type: object
required: [schema_version, yaup, validation]
properties:
  schema_version: {const: 1}
  yaup:
    type: object
    required: [repository, version]
    properties:
      repository: {type: string, minLength: 1}
      version: {type: string, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'}
  rule_overrides: {type: object}
  execution_guardrails:
    type: object
    additionalProperties: false
    properties:
      test_first:
        type: array
        items:
          type: object
          required: [source_paths, test_files, command, expected_failure]
          additionalProperties: false
          properties:
            source_paths:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
            test_files:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
            command: {type: string, minLength: 1}
            expected_failure: {type: string, minLength: 1}
      required_validation:
        type: array
        items: {type: string, minLength: 1}
  git_guardrails:
    type: object
    additionalProperties: false
    properties:
      task_start:
        type: object
        additionalProperties: false
        properties:
          planning: {$ref: '#/$defs/taskStartGitGuardrail'}
          execution: {$ref: '#/$defs/taskStartGitGuardrail'}
      diff_review:
        type: object
        additionalProperties: false
        properties:
          base_ref: {type: string, minLength: 1, default: main}
          rules:
            type: array
            items:
              type: object
              required: [id, changed_paths, test_paths, action]
              additionalProperties: false
              properties:
                id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*$'}
                changed_paths:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
                test_paths:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
                minimum_files: {type: integer, minimum: 1, default: 1}
                action: {enum: [block, warn, require_resolution]}
  validation:
    type: object
    additionalProperties:
      oneOf:
        - type: object
          required: [command]
          properties: {command: {type: string, minLength: 1}}
        - type: object
          required: [exemption]
          properties:
            exemption:
              type: object
              required: [reason, expires]
              properties:
                reason: {type: string, minLength: 1}
                expires: {type: string, format: date}
additionalProperties: false
$defs:
  taskStartGitGuardrail:
    type: object
    additionalProperties: false
    properties:
      clean_working_tree: {enum: [block, warn]}
      expected_branch:
        type: object
        required: [patterns, action]
        additionalProperties: false
        properties:
          patterns:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
          action: {enum: [block, warn]}
